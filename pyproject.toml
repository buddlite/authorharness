[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "writer-harness"
version = "0.1.0"
description = "A model-agnostic, continuity-aware fiction writing harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.3,<2",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
    "pydantic>=2.7,<3",
    "tenacity>=8.2,<10",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.6,<1",
]

[project.scripts]
writer = "writer_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/writer_harness"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
